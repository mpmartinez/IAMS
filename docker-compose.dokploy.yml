# IAMS (Integrated Asset Management System) — Dokploy stack for the Hetzner box.
#
# ─── Setup in Dokploy ─────────────────────────────────────────────────────────
#  1. Create a "Compose" service pointing at this file (docker-compose.dokploy.yml).
#  2. In the Environment tab set: DATABASE_CONNECTION (the Neon connection string, in
#     Npgsql key=value form - NOT the postgresql:// URI, Npgsql cannot parse it), JWT_KEY,
#     SMTP_HOST, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM_EMAIL.
#  3. Deploy. Then copy the uploads directory from the old droplet into iams-uploads.
#     The database no longer needs seeding - it is already in Neon.
#  4. Point iams.m2netsolutions.com DNS at the Hetzner box → Traefik issues the cert.
#
# ─── Routing ──────────────────────────────────────────────────────────────────
#  Traefik terminates TLS for iams.m2netsolutions.com and splits by path:
#    /api + /health  -> api  (port 5000, higher priority)
#    everything else -> web  (nginx serving the Blazor WASM on plain HTTP)
#
# ─── Data ─────────────────────────────────────────────────────────────────────
#  The database is PostgreSQL, hosted on Neon (ap-southeast-1, same region as this box).
#  Nothing about it lives on disk any more, so there is no iams-data volume.
#
#  Attachment FILES are still local, at /app/Uploads (volume iams-uploads). Only their
#  metadata rows are in the database - drop that volume and every receipt, photo and
#  warranty document is gone while the rows still point at them.
#
#  Backups are now Neon's job: point-in-time restore per branch, not a file to copy.
services:
  iams-api:
    image: ghcr.io/mpmartinez/iams-api:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION:?DATABASE_CONNECTION must be set}
      Jwt__Key: ${JWT_KEY:?JWT_KEY must be set}
      Jwt__Issuer: IAMS
      Jwt__Audience: IAMS
      Cors__AllowedOrigins__0: https://iams.m2netsolutions.com
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-2525}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName: ${SMTP_FROM_NAME:-IAMS}
      App__WebUrl: https://iams.m2netsolutions.com
    volumes:
      # No iams-data volume: the database lives in Neon now. iams-uploads must stay -
      # attachment files are on disk, only their metadata rows are in the database.
      - iams-uploads:/app/Uploads
    # The image's built-in HEALTHCHECK runs `curl -f /health`, but curl isn't in the
    # aspnet runtime image, so the check always fails and the container is marked
    # "unhealthy" — and Dokploy's Traefik then won't route to it. The app is fine;
    # disable the broken check (Traefik does its own liveness routing).
    healthcheck:
      disable: true
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.iams-api.rule=Host(`iams.m2netsolutions.com`) && (PathPrefix(`/api`) || PathPrefix(`/health`))"
      - "traefik.http.routers.iams-api.entrypoints=websecure"
      - "traefik.http.routers.iams-api.tls=true"
      - "traefik.http.routers.iams-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.iams-api.priority=100"
      - "traefik.http.services.iams-api.loadbalancer.server.port=5000"

  iams-web:
    image: ghcr.io/mpmartinez/iams-web:latest
    pull_policy: always
    restart: unless-stopped
    volumes:
      - ./nginx.dokploy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - iams-api
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.middlewares.iams-compress.compress=true"
      - "traefik.http.routers.iams-web.rule=Host(`iams.m2netsolutions.com`)"
      - "traefik.http.routers.iams-web.entrypoints=websecure"
      - "traefik.http.routers.iams-web.tls=true"
      - "traefik.http.routers.iams-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.iams-web.priority=10"
      - "traefik.http.routers.iams-web.middlewares=iams-compress"
      - "traefik.http.services.iams-web.loadbalancer.server.port=80"
      - "traefik.http.routers.iams-web-http.rule=Host(`iams.m2netsolutions.com`)"
      - "traefik.http.routers.iams-web-http.entrypoints=web"
      - "traefik.http.routers.iams-web-http.middlewares=iams-redirect"
      - "traefik.http.middlewares.iams-redirect.redirectscheme.scheme=https"

volumes:
  iams-uploads:

networks:
  dokploy-network:
    external: true
