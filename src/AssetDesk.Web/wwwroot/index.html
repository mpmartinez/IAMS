<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AssetDesk - IT Asset &amp; Service Management</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="theme-color" content="#0f172a" />
    <!-- Tailwind is compiled ahead of time into css/app.css - see tailwind.config.js and
         Styles/app.css. It used to be generated in the browser by the Play CDN, which is
         ~120 KB of render-blocking third-party JS that kept a MutationObserver recomputing
         styles on every Blazor render, and - being cross-origin - was skipped by the service
         worker, so the installed app rendered unstyled offline. -->
    <script src="js/theme.js"></script>
    <!-- The ?v= is load-bearing. app.css is a compiled but unhashed static file, and the
         published service worker puts it in its cache at install (service-worker.published.js),
         so without a changing URL an edit here can sit invisible behind both the browser HTTP
         cache and the SW cache. Bump this whenever Styles/app.css is rebuilt, and bump cacheName in
         service-worker.published.js alongside it. -->
    <link rel="stylesheet" href="css/app.css?v=5" />
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 antialiased">
    <div id="app" class="h-full">
        <div class="flex items-center justify-center h-full">
            <div class="text-center">
                <div class="relative w-16 h-16 mx-auto mb-4">
                    <div class="absolute inset-0 rounded-full border-4 border-slate-200 dark:border-slate-700"></div>
                    <div class="absolute inset-0 rounded-full border-4 border-primary-500 border-t-transparent animate-spin"></div>
                </div>
                <p class="text-slate-600 dark:text-slate-400 text-sm">Loading...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="fixed bottom-0 inset-x-0 p-4 bg-red-500 text-white text-center hidden">
        An error has occurred. <a href="" class="underline">Reload</a>
    </div>

    <script src="js/script-loader.js"></script>
    <script src="js/qrScanner.js"></script>
    <script src="js/offline-storage.js"></script>
    <script src="js/print.js"></script>
    <script src="js/fileUtils.js"></script>
    <script src="js/notifications.js"></script>
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>
</html>
