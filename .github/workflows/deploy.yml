name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/iams-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/iams-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

          # Diagnostics. A fingerprint is not a secret - it is the public identity of the
          # key, which is exactly what the server checks against authorized_keys. If the
          # line below does not match `ssh-keygen -lf ~/.ssh/github_actions.pub` on your
          # machine, the DO_SSH_KEY_B64 secret holds the wrong key.
          echo "--- decoded key ---"
          if ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/derived.pub 2>/dev/null; then
            ssh-keygen -lf /tmp/derived.pub
          else
            echo "FAILED TO PARSE: the decoded file is not a valid OpenSSH private key."
            echo "First line of what was decoded:"
            head -c 40 ~/.ssh/deploy_key; echo
          fi
        env:
          SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}

      - name: Create .env file on server
        run: |
          ssh -v -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -i ~/.ssh/deploy_key ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} "cd ${{ secrets.DO_PROJECT_PATH }} && printf 'DATABASE_CONNECTION=${{ secrets.DATABASE_CONNECTION }}\nJWT_KEY=${{ secrets.JWT_KEY }}\nSMTP_HOST=${{ secrets.SMTP_HOST }}\nSMTP_PORT=${{ secrets.SMTP_PORT }}\nSMTP_USERNAME=${{ secrets.SMTP_USERNAME }}\nSMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}\nSMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL }}\nSMTP_FROM_NAME=${{ secrets.SMTP_FROM_NAME }}\nAPP_WEB_URL=${{ secrets.APP_WEB_URL }}\n' > .env"

      - name: Deploy to server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} "cd ${{ secrets.DO_PROJECT_PATH }} && echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_USER --password-stdin && docker pull ghcr.io/$GHCR_OWNER/iams-api:latest && docker pull ghcr.io/$GHCR_OWNER/iams-web:latest && docker compose -f docker-compose.prod.yml down && docker compose -f docker-compose.prod.yml up -d && docker image prune -f"