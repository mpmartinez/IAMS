name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/iams-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/iams-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Dokploy owns the deployment. It clones this repo into
  # /etc/dokploy/compose/iams-iams-qjvalq/code/ and runs docker-compose.dokploy.yml,
  # whose services pull ghcr.io/<owner>/iams-{api,web}:latest with pull_policy: always.
  # So all this job has to do is tell Dokploy that fresh images exist.
  #
  # This replaces an SSH-based deploy left over from DigitalOcean, which cd'd into a
  # directory and ran `docker compose -f docker-compose.prod.yml up -d` by hand. On a
  # Dokploy box that starts containers Dokploy does not manage and writes a .env it may
  # overwrite - two deploy systems fighting over the same directory. It also needed five
  # secrets (DO_SSH_KEY_B64, DO_HOST, DO_USERNAME, DO_PROJECT_PATH and the app config),
  # none of which are required any more and all of which can be deleted.
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Dokploy redeploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DOKPLOY_DEPLOY_WEBHOOK is not set."
            echo "Get it from the Dokploy UI: open the IAMS compose service, then"
            echo "Deployments -> Webhook URL, and save it as a repository secret."
            echo "The images for this commit are already in GHCR, so until then you can"
            echo "deploy by clicking Redeploy in Dokploy."
            exit 1
          fi

          # --fail so an HTTP error is a failed job rather than a silent success.
          curl --fail --silent --show-error --location --request POST "$WEBHOOK"
          echo
          echo "Redeploy triggered. Dokploy pulls :latest, so watch the API container's"
          echo "logs there - the database migration runs on startup."
