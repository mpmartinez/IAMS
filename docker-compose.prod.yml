services:
  # API Service (pre-built image from GHCR)
  api:
    image: ghcr.io/${GHCR_USER:-mpmartinez}/iams-api:latest
    # Without this, `docker compose up -d` reuses the locally cached :latest and
    # recreates the container from a stale image - new container, old code.
    pull_policy: always
    container_name: iams-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      # PostgreSQL. Contains a password, so it is never committed - set
      # DATABASE_CONNECTION in the server's .env alongside JWT_KEY.
      - ConnectionStrings__DefaultConnection=${DATABASE_CONNECTION:?DATABASE_CONNECTION must be set in .env}
      # No default: the API refuses to start without a real key rather than silently
      # signing tokens with a placeholder. Set JWT_KEY in the server's .env.
      - Jwt__Key=${JWT_KEY:?JWT_KEY must be set in .env}
      - Jwt__Issuer=${JWT_ISSUER:-IAMS}
      - Jwt__Audience=${JWT_AUDIENCE:-IAMS}
      - Cors__AllowedOrigins__0=${CORS_ORIGIN:-https://m2netsolutions.com}
      - Smtp__Host=${SMTP_HOST}
      - Smtp__Port=${SMTP_PORT:-2525}
      - Smtp__Username=${SMTP_USERNAME}
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__FromEmail=${SMTP_FROM_EMAIL}
      - Smtp__FromName=${SMTP_FROM_NAME:-AssetDesk}
      - App__WebUrl=${APP_WEB_URL:-https://m2netsolutions.com:5022}
    volumes:
      # No iams-data volume: the database is external, reached via DATABASE_CONNECTION.
      # The uploads bind mount must
      # stay - attachment files are on disk, only their metadata rows are in the database.
      - ./data/uploads:/app/Uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Web Service (pre-built image from GHCR)
  web:
    image: ghcr.io/${GHCR_USER:-mpmartinez}/iams-web:latest
    # Without this, `docker compose up -d` reuses the locally cached :latest and
    # recreates the container from a stale image - new container, old code.
    pull_policy: always
    container_name: iams-web
    ports:
      - "5022:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped

