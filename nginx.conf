events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compression. `dotnet publish` writes a .gz and a .br next to every framework asset,
    # compressed once at the highest level; gzip_static hands those over instead of nginx
    # re-gzipping a multi-megabyte payload at level 1 on every cache miss. Dynamic gzip stays
    # on for what has no precompiled companion.
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 1000;

    # HTTPS server
    server {
        listen 443 ssl;
        server_name m2netsolutions.com www.m2netsolutions.com;
        root /usr/share/nginx/html;
        index index.html;

        # SSL certificates
        ssl_certificate /etc/letsencrypt/live/m2netsolutions.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/m2netsolutions.com/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Blazor WebAssembly specific headers
        location / {
            try_files $uri $uri/ /index.html;
        }

        # The boot document names every hashed asset, so a stale copy pins the whole app to an
        # old build. It must be revalidated, not cached.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # ---------------------------------------------------------------------------------
        # /_framework - brotli beats gzip by roughly another 20% on the WASM payload, but the
        # official nginx image ships no brotli module so nginx cannot produce it. It does not
        # have to: publish already wrote the .br, so we hand that file over and label it.
        #
        # The -f test is what makes this safe. Rewriting to a .br that does not exist would
        # serve the raw file while still claiming Content-Encoding: br, which decodes to
        # nothing; the request only takes that branch when the file is really there and the
        # client really asked for br. Everything else falls through to gzip_static.
        #
        # add_header does not inherit into an if block, so the cache headers are repeated
        # inside it. Content-Type does not survive the rewrite either - the URI ends in .br,
        # which no mime type claims - so each extension needs its own block to name the type
        # the browser must see. .wasm and .js are the ones that matter: a module script or a
        # streamed WebAssembly instantiation is rejected outright on the wrong type.
        #
        # Regex locations are tried in the order they appear, so these come before the
        # general asset rule at the bottom.
        # ---------------------------------------------------------------------------------
        location ~* ^/_framework/.+\.wasm$ {
            types { application/wasm wasm; }
            default_type application/wasm;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Vary "Accept-Encoding";

            # Dynamic gzip must be off wherever the .br can be served: the gzip filter runs
            # before the headers filter, sees no Content-Encoding yet, and would gzip the
            # brotli bytes - the response then carries both encodings and decodes to nothing.
            # gzip_static is a different directive and stays on, so a client that did not ask
            # for br still gets the precompiled .gz.
            gzip off;

            set $br "";
            if ($http_accept_encoding ~* br) { set $br "y"; }
            if (-f $request_filename.br) { set $br "${br}f"; }
            if ($br = "yf") {
                add_header Cache-Control "public, max-age=31536000, immutable";
                add_header Vary "Accept-Encoding";
                add_header Content-Encoding br;
                rewrite ^(.*)$ $1.br break;
            }
        }

        location ~* ^/_framework/.+\.js$ {
            default_type text/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Vary "Accept-Encoding";
            gzip off;

            set $br "";
            if ($http_accept_encoding ~* br) { set $br "y"; }
            if (-f $request_filename.br) { set $br "${br}f"; }
            if ($br = "yf") {
                add_header Cache-Control "public, max-age=31536000, immutable";
                add_header Vary "Accept-Encoding";
                add_header Content-Encoding br;
                rewrite ^(.*)$ $1.br break;
            }
        }

        # The ICU data files, ~1.4 MB raw for the set the app loads.
        location ~* ^/_framework/.+\.dat$ {
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Vary "Accept-Encoding";
            gzip off;

            set $br "";
            if ($http_accept_encoding ~* br) { set $br "y"; }
            if (-f $request_filename.br) { set $br "${br}f"; }
            if ($br = "yf") {
                add_header Cache-Control "public, max-age=31536000, immutable";
                add_header Vary "Accept-Encoding";
                add_header Content-Encoding br;
                rewrite ^(.*)$ $1.br break;
            }
        }

        # Anything else under /_framework. A plain prefix, NOT ^~: a ^~ match wins outright and
        # stops nginx ever reaching a regex location, which would leave the three blocks above
        # as dead config and send the whole payload uncompressed.
        location /_framework/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Vary "Accept-Encoding";
        }

        # Razor class library content, also at content-hashed URLs. ^~ is deliberate here -
        # there is no regex block for it, and it must not fall into the revalidate rule below.
        location ^~ /_content/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Vary "Accept-Encoding";
        }

        # API proxy
        # ^~ ensures this prefix takes precedence over the static-asset regex
        # locations (otherwise URLs like /api/.../qr.png get matched by
        # the *.png regex and 404 instead of being proxied to the API).
        location ^~ /api/ {
            proxy_pass http://api:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # SSE support
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://api:5000/health;
        }

        # The app's own assets are NOT content-hashed - js/qrScanner.js is the same URL in every
        # build. They used to be served `expires 1y; immutable`, so an edit could not reach a
        # returning browser for a year: index.html would come back new while the js it loads
        # stayed a year old. They revalidate instead; an unchanged file costs a 304.
        # css/app.css carries its own ?v= (see index.html) and is covered by the same rule.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webmanifest)$ {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }
    }
}
